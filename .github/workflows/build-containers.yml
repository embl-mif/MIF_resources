name: Build containers

# Builds every containers/<name>/ folder that has a Dockerfile and pushes it to
# ghcr.io/<owner>/<name>:<VERSION> (plus :latest), where VERSION is read from containers/<name>/VERSION.
# - Push to main: rebuilds only the folders changed by the push.
# - Pull request: builds the changed folders to check they work, without pushing.
# - Manual run (Actions tab): builds one folder, or all of them if left empty.

on:
  push:
    branches: [main]
    paths:
      - "containers/**"
  pull_request:
    paths:
      - "containers/**"
  workflow_dispatch:
    inputs:
      container:
        description: "Folder under containers/ to build (empty = all)"
        required: false
        default: ""
      overwrite:
        description: "Replace the image if this VERSION tag already exists"
        type: boolean
        default: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      containers: ${{ steps.list.outputs.containers }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: List containers to build
        id: list
        env:
          EVENT: ${{ github.event_name }}
          INPUT_CONTAINER: ${{ inputs.container }}
          PUSH_BEFORE: ${{ github.event.before }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ]; then
            if [ -n "$INPUT_CONTAINER" ]; then
              dirs="$INPUT_CONTAINER"
            else
              dirs=$(ls containers)
            fi
          else
            base="$PUSH_BEFORE"
            [ "$EVENT" = "pull_request" ] && base="$PR_BASE"
            # First push of a branch has no "before" commit: compare with the parent
            if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
              base="HEAD^"
            fi
            dirs=$(git diff --name-only "$base" HEAD -- containers/ | cut -d/ -f2 | sort -u)
          fi

          selected=()
          for d in $dirs; do
            if [ -f "containers/$d/Dockerfile" ] && [ -f "containers/$d/VERSION" ]; then
              selected+=("$d")
            elif [ "$EVENT" = "workflow_dispatch" ] && [ -n "$INPUT_CONTAINER" ]; then
              echo "::error::containers/$d needs both a Dockerfile and a VERSION file"
              exit 1
            fi
          done

          json=$(printf '%s\n' "${selected[@]}" | jq -R . | jq -sc 'map(select(. != ""))')
          echo "Containers to build: $json"
          echo "containers=$json" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.containers != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        container: ${{ fromJson(needs.changes.outputs.containers) }}
    env:
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v4

      # The CUDA/PyTorch images are several GB; the default runner does not have enough free disk for them
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - name: Read version
        id: ver
        run: |
          version=$(tr -d '[:space:]' < "containers/${{ matrix.container }}/VERSION")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/${{ matrix.container }}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Pipelines pin images by tag, so a published tag must not change silently.
      # Changing a Dockerfile requires bumping its VERSION, unless the manual run asks to overwrite.
      - name: Check the tag is not already published
        if: env.PUSH == 'true' && !inputs.overwrite
        run: |
          ref="${{ steps.ver.outputs.image }}:${{ steps.ver.outputs.version }}"
          if docker buildx imagetools inspect "$ref" > /dev/null 2>&1; then
            echo "::error::$ref already exists. Bump containers/${{ matrix.container }}/VERSION, or run the workflow manually with 'overwrite'."
            exit 1
          fi

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.ver.outputs.image }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: containers/${{ matrix.container }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
