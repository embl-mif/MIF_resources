name: "zarrsmith_conversion"
description: "Convert microscope datasets listed in a ZarrSmith batch CSV into OME-Zarr stores."
keywords:
  - zarr
  - microscopy
  - zarrsmith
  - conversion
tools:
  - name: "zarrsmith"
    description: "Python library for converting MIF microscope file formats into OME-Zarr."
    homepage: "https://github.com/embl-mif/zarrsmith"
    documentation: "https://embl-mif.github.io/zarrsmith/"
    tool_dev_url: "https://github.com/embl-mif/zarrsmith"
    licence: ["MIT"]
input:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information.
        e.g. [ id:'sample1' ]
  - row:
      type: map
      description: "One parsed row from the ZarrSmith input CSV."
  - input_dataset:
      type: file
      description: "Input microscopy dataset referenced by row.input."
output:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information.
  - zarr:
      type: directory
      description: "Converted OME-Zarr store or stores."
      pattern: "*.zarr"
  - versions:
      type: file
      description: "File containing software versions."
      pattern: "versions.yml"
authors:
  - "nvivanco"
  - "grinic"
