name: "zarr_feature_extraction"
description: "Extracts morphological and intensity features from Zarr labeled datasets using skimage regionprops. Uses the package CLI with Nextflow-managed single-threaded Dask execution by default."
keywords:
  - zarr
  - microscopy
  - feature-extraction
  - skimage
  - regionprops
  - dask
tools:
  - name: "scikit-image"
    description: "A collection of algorithms for image processing."
    homepage: "https://scikit-image.org/"
  - name: "dask"
    description: "Flexible library for parallel computing in Python."
    homepage: "https://dask.org/"
input:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information.
        e.g. [ id:'sample1' ]
  - zarr_store:
      type: path
      description: "Input Zarr store directory."
  - intensity_comp:
      type: string
      description: "Internal Zarr path or component name for intensity data."
  - label_comp:
      type: string
      description: "Internal Zarr path or component name for segmentation labels."
output:
  - meta:
      type: map
      description: |
        Groovy Map containing sample information.
  - parquet:
      type: file
      description: "Extracted features in Parquet format."
      pattern: "*.features.parquet"
authors:
  - "nvivanco"
  - "grinic"
